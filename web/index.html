<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <meta content="mobile_tab" name="shell-type" />
    <title>Triage · Escaneo Devoluciones</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <style>
      @layer base {
        html,
        body {
          width: 100%;
          margin: 0;
          padding: 0;
          min-height: 100%;
        }
        body {
          overscroll-behavior-y: none;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
      #scannerRegion video {
        object-fit: cover;
        width: 100%;
        height: 100%;
        border-radius: 0.5rem;
      }
      #scannerRegion {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #scannerRegion > div {
        width: 100% !important;
        height: 100% !important;
        border: 0 !important;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'on-background': '#0b1c30',
              'inverse-surface': '#213145',
              'on-primary-fixed': '#00164f',
              'tertiary-container': '#a45800',
              'inverse-on-surface': '#eaf1ff',
              'surface-container-lowest': '#ffffff',
              'on-surface': '#0b1c30',
              secondary: '#565e74',
              error: '#ba1a1a',
              outline: '#737688',
              'surface-dim': '#cbdbf5',
              'secondary-fixed': '#dae2fd',
              primary: '#0045cc',
              'surface-container-highest': '#d3e4fe',
              'secondary-container': '#dae2fd',
              'primary-fixed': '#dce1ff',
              'on-primary-container': '#ebecff',
              surface: '#f8f9ff',
              'on-secondary': '#ffffff',
              'surface-variant': '#d3e4fe',
              'inverse-primary': '#b6c4ff',
              'on-tertiary-container': '#ffeadd',
              'error-container': '#ffdad6',
              'primary-fixed-dim': '#b6c4ff',
              'primary-container': '#0d5bff',
              'on-tertiary': '#ffffff',
              'tertiary-fixed': '#ffdcc3',
              'surface-tint': '#004fe5',
              'on-surface-variant': '#434656',
              'on-secondary-container': '#5c647a',
              tertiary: '#814400',
              'tertiary-fixed-dim': '#ffb77d',
              'surface-container-low': '#eff4ff',
              background: '#f8f9ff',
              'outline-variant': '#c3c5d9',
              'surface-bright': '#f8f9ff',
              'on-primary': '#ffffff',
              'secondary-fixed-dim': '#bec6e0',
              'on-primary-fixed-variant': '#003bb0',
              'on-error': '#ffffff',
              'surface-container': '#e5eeff',
              'on-secondary-fixed': '#131b2e',
              'on-tertiary-fixed': '#2f1500',
              'on-tertiary-fixed-variant': '#6e3900',
              'surface-container-high': '#dce9ff',
              'on-error-container': '#93000a',
              'on-secondary-fixed-variant': '#3f465c',
            },
            borderRadius: {
              DEFAULT: '0.125rem',
              lg: '0.25rem',
              xl: '0.5rem',
              full: '0.75rem',
            },
            spacing: {
              'space-xs': '0.25rem',

              'code-md': ['14px', { lineHeight: '20px', fontWeight: '500' }],

              'headline-md': ['20px', { lineHeight: '28px', fontWeight: '600' }],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
